name: HILFER content and engine tests

on:
  pull_request:
  push:
    branches:
      - feat/artifact-corpus-json-v1

permissions:
  contents: read
  pull-requests: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run unit and content tests
        id: unit
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/hilfer-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/hilfer-test.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment with diagnostic output if tests fail
        if: ${{ github.event_name == 'pull_request' && steps.unit.outputs.exit_code != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            printf '### CI test failure (temporary diagnostic)\n\n'
            printf '```text\n'
            tail -n 110 "$RUNNER_TEMP/hilfer-test.log"
            printf '\n```\n'
          } > "$RUNNER_TEMP/hilfer-diagnostic.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/hilfer-diagnostic.md"
      - name: Fail check when tests fail
        if: ${{ steps.unit.outputs.exit_code != '0' }}
        run: exit 1
